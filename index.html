      en: { tagline: 'Block Shortcuts · Remap Keys (Premium) · Global Control', featuresTitle: '✨ Features', features: ['Block keyboard shortcuts on any website — stop F1, Ctrl+W, and other unwanted keys', 'Remap keys: redirect key A to trigger key B\'s action — rare in similar tools (Premium)', 'Global rules: one set applies to every site you visit', 'One-click key recording: press the combo you want, auto-detected instantly', 'Free: 3 rules for casual use. Premium: unlimited rules + remap + import/export', 'All rules stored locally in your browser — private, no cloud sync'], thankTitle: '💌 A Note to You', thank: ['Thank you for using vkt-shortcut. I built this because web apps and admin panels constantly clash with browser shortcuts, and I wanted a precise, lightweight control tool.', 'If it helps you too, that\'s already the best reward.', 'Of course, if you\'d like to <span class="heart">☕</span> buy me a coffee, it would truly make my day.'], ctaHint: 'Click below to visit the support page', btnText: 'Support My Work', privacyPolicy: 'Privacy' },
      ja: { tagline: 'ショートカットブロック · キーリマップ(プレミアム) · グローバル管理', featuresTitle: '✨ 機能', features: ['任意のウェブサイトのキーボードショートカットをブロック', 'キーリマップ：キーAをキーBの動作にリダイレクト（プレミアム）', 'グローバルルール：すべてのサイトで有効化', 'ワンクリック録力：押したキーを自動認識', '無料3ルール、プレミアム無制限+リマップ+インポート/エクスポート', 'ローカル保存、プライバシー重視'], thankTitle: '💌 感謝', thank: ['vkt-shortcutをご利用いただきありがとうございます。', 'お役に立てれば幸いです。', 'コーヒーを一杯おごっていただけると嬉しいです。'], ctaHint: 'サポートページへ', btnText: 'Support My Work', privacyPolicy: 'プライバシー' },
      de: { tagline: 'Shortcuts blockieren · Tasten umbinden (Premium) · Global steuern', featuresTitle: '✨ Funktionen', features: ['Tastenkürzel auf jeder Website blockieren', 'Tasten umbinden: Taste A auf Taste B umleiten (Premium)', 'Globale Regeln: auf allen Seiten aktiv', 'Ein-Klick-Aufnahme: Tastenkombination sofort erkannt', 'Kostenlos 3 Regeln, Premium unbegrenzt + Remap + Import/Export', 'Lokale Speicherung, datenschutzfreundlich'], thankTitle: '💌 Danke', thank: ['Vielen Dank für vkt-shortcut.', 'Freut mich, wenn es hilft.', 'Ein Kaffee würde mich sehr freuen.'], ctaHint: 'Zur Support-Seite', btnText: 'Support My Work', privacyPolicy: 'Datenschutz' },
      es: { tagline: 'Bloquear atajos · Remapear teclas (Premium) · Control global', featuresTitle: '✨ Características', features: ['Bloquea atajos de teclado en cualquier sitio web', 'Remapea teclas: redirige la tecla A a la acción de la tecla B (Premium)', 'Reglas globales: se activan en todos los sitios', 'Grabación con un clic: presiona la combinación, auto-detectada', 'Gratis 3 reglas, Premium ilimitado + remapeo + importar/exportar', 'Almacenamiento local, privacidad primero'], thankTitle: '💌 Gracias', thank: ['Gracias por usar vkt-shortcut.', 'Si te ayuda, es la mejor recompensa.', 'Un café me haría muy feliz.'], ctaHint: 'Ir a soporte', btnText: 'Support My Work', privacyPolicy: 'Privacidad' },
      fr: { tagline: 'Bloquer raccourcis · Remapper touches (Premium) · Contrôle global', featuresTitle: '✨ Fonctionnalités', features: ['Bloquez les raccourcis clavier sur n\'importe quel site', 'Remappez les touches : redirigez la touche A vers l\'action de la touche B (Premium)', 'Règles globales : actives sur tous les sites', 'Enregistrement en un clic : appuyez sur la combinaison, auto-détectée', 'Gratuit 3 règles, Premium illimité + remappage + import/export', 'Stockage local, confidentialité d\'abord'], thankTitle: '💌 Merci', thank: ['Merci d\'utiliser vkt-shortcut.', 'S\'il vous aide, c\'est la meilleure récompensation.', 'Un café me ferait très plaisir.'], ctaHint: 'Page de soutien', btnText: 'Support My Work', privacyPolicy: 'Confidentialité' }
    };
    function detectLang() { const c = (navigator.language || 'en').split('-')[0].toLowerCase(); return I18N[c] ? c : 'en'; }
    function applyLang(lang) { const t = I18N[lang]; document.querySelectorAll('[data-i18n]').forEach(el => { const k = el.getAttribute('data-i18n'); if (t[k]) el.textContent = t[k]; }); document.getElementById('featureList').innerHTML = t.features.map(f => `<li>${f}</li>`).join(''); document.getElementById('thankText').innerHTML = t.thank.map(p => `<p>${p}</p>`).join(''); document.documentElement.lang = lang; }
    applyLang(detectLang());
  </script>
</body>
</html>
