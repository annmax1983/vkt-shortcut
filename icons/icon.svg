<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4F8EF7"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="key" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E8EDF3"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#1E3A5F" flood-opacity="0.35"/>
    </filter>
    <filter id="innerShadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1E3A5F" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Rounded square background -->
  <rect x="16" y="16" width="224" height="224" rx="48" ry="48" fill="url(#bg)"/>

  <!-- Keyboard body -->
  <g filter="url(#shadow)">
    <rect x="44" y="88" width="168" height="96" rx="14" ry="14" fill="url(#key)" opacity="0.95"/>
  </g>

  <!-- Key rows -->
  <!-- Row 1: function keys (small) -->
  <g fill="#B0BFCC" opacity="0.6">
    <rect x="56" y="98" width="16" height="12" rx="3"/>
    <rect x="76" y="98" width="16" height="12" rx="3"/>
    <rect x="96" y="98" width="16" height="12" rx="3"/>
    <rect x="116" y="98" width="16" height="12" rx="3"/>
    <rect x="136" y="98" width="16" height="12" rx="3"/>
    <rect x="156" y="98" width="16" height="12" rx="3"/>
    <rect x="176" y="98" width="16" height="12" rx="3"/>
    <rect x="196" y="98" width="16" height="12" rx="3"/>
  </g>

  <!-- Row 2: main keys -->
  <g fill="#D1D9E0">
    <rect x="56" y="116" width="20" height="18" rx="4"/>
    <rect x="80" y="116" width="20" height="18" rx="4"/>
    <rect x="104" y="116" width="20" height="18" rx="4"/>
    <rect x="128" y="116" width="20" height="18" rx="4"/>
    <rect x="152" y="116" width="20" height="18" rx="4"/>
    <rect x="176" y="116" width="20" height="18" rx="4"/>
  </g>

  <!-- Row 3: main keys -->
  <g fill="#D1D9E0">
    <rect x="56" y="138" width="20" height="18" rx="4"/>
    <rect x="80" y="138" width="20" height="18" rx="4"/>
    <rect x="104" y="138" width="20" height="18" rx="4"/>
    <rect x="128" y="138" width="20" height="18" rx="4"/>
    <rect x="152" y="138" width="20" height="18" rx="4"/>
    <rect x="176" y="138" width="20" height="18" rx="4"/>
  </g>

  <!-- Row 4: spacebar -->
  <g fill="#D1D9E0">
    <rect x="56" y="160" width="20" height="18" rx="4"/>
    <rect x="80" y="160" width="84" height="18" rx="4"/>
    <rect x="168" y="160" width="28" height="18" rx="4"/>
  </g>

  <!-- Highlighted key (Ctrl) - the "shortcut" key -->
  <rect x="56" y="160" width="20" height="18" rx="4" fill="#FF6B35" opacity="0.95"/>
  <text x="66" y="173" text-anchor="middle" font-family="Arial,sans-serif" font-size="8" font-weight="bold" fill="white">⌃</text>

  <!-- Lightning bolt overlay (shortcut symbol) -->
  <g transform="translate(170, 50)" filter="url(#innerShadow)">
    <polygon points="18,0 6,22 14,22 8,42 28,16 18,16 24,0" fill="#FFD700" opacity="0.95"/>
    <polygon points="18,2 8,22 15,22 10,38 26,17 18,17 22,2" fill="#FFECB3" opacity="0.5"/>
  </g>
</svg>
